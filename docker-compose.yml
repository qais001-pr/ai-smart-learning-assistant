services:
  backend:
    build: ./backend
    container_name: ai-backend
    env_file:
      - .env
    ports:
      - "8000:8000"        # API + test page at http://127.0.0.1:8000/docs
    volumes:
      - app_data:/app/data

  frontend:
    build: ./frontend
    container_name: ai-frontend
    ports:
      - "3000:80"          # the website: http://127.0.0.1:3000
    depends_on:
      - backend

volumes:
  app_data:
