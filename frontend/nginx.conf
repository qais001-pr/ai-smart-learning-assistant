server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # React app (single page)
  location / {
    try_files $uri /index.html;
  }

  # API calls go to the backend container (service name: backend)
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;   # AI replies can take a while
  }
}
